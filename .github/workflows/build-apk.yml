name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK parts
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Unzip project
        run: |
          unzip -q project.zip -d game
          echo "PROJ=$(dirname "$(find game -name project.godot | head -1)")" >> $GITHUB_ENV

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS

      - name: Import and export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJ" --import || true
          godot --headless --path "$PROJ" --export-debug "Android" "$GITHUB_WORKSPACE/build/IronHarbor.apk" 2>&1 | tee export.log
          ls -la build
          test -s build/IronHarbor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IronHarbor-apk
          path: build/IronHarbor.apk
